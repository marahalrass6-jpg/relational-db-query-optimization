services:
  postgres:
    image: postgres:16-alpine
    container_name: relational_db_optimization_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: operations_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d operations_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
